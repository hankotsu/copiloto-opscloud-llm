# Instalar una vez:  pip install pre-commit  &&  pre-commit install
# Se ejecuta en cada "git commit"; bloquea el commit si encuentra un problema.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks            # API keys, tokens y credenciales
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]  # nada de datasets, sqlite ni videos
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: confidencialidad
        name: Sin datos reales de clientes ni empleadores
        entry: python scripts/verificar_confidencialidad.py
        language: system
        pass_filenames: false
